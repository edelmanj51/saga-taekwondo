PROGRAM_4_DESCRIPTION: "<p>Saga's Competition Team is where champions are developed. Under the direct coaching of Sam Sa — a nationally ranked competitor who has guided athletes to USATKD Nationals and state championship podiums — team members train with the intensity, precision, and game-plan strategy required to win at the highest levels of Taekwondo competition.</p><p>Open to ages 7 and up with no prior competition experience required. Whether you&#x2019;re stepping onto your first tournament mat or chasing a national title, Sam builds a plan around you. Competition opportunities through USATKD, AAU, and regional circuits throughout the year.</p>"
