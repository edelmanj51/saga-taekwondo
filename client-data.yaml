PROGRAM_2_DESCRIPTION: "Teens thrive at Saga. Our teen Taekwondo classes build strength, coordination, and the mental toughness to handle anything life throws at them. Competition opportunities available for those who want to take it to the next level — with coaches who have guided athletes all the way to national championships."
