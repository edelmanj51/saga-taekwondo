ABOUT_TEXT: "Saga Taekwondo is Lake Forest's premier competition-focused Taekwondo academy, proudly serving kids, teens, and adults across South Orange County — including Irvine, Mission Viejo, Foothill Ranch, Laguna Hills, and Aliso Viejo. We combine rigorous technique with championship-level coaching to build confident, disciplined, and competition-ready martial artists at every level."
INSTRUCTOR_1_NAME: "Sam Sa"
