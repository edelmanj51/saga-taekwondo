INSTRUCTOR_1_TITLE: "Owner & Head Instructor"
INSTRUCTOR_1_BIO: "Sam Sa is a national-level Taekwondo competitor and certified instructor who has coached athletes to podiums at USATKD Nationals and state championships across the country. With deep roots in competitive Taekwondo, Sam founded Saga Taekwondo to bring elite-level training and genuine competitive mentorship to families in Lake Forest and all of South Orange County. His athletes don't just learn to kick — they learn to win, stay focused under pressure, and carry that mindset into every part of their lives. Whether you're stepping on the mat for the first time or preparing for your next national tournament, Sam trains you to be your best."
