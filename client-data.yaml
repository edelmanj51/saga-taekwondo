PROGRAM_1_SESSION_LEN: "60-min classes"
PROGRAM_1_DESCRIPTION: "Build focus, discipline, and real self-defense skills in our kids Taekwondo classes. Every class grows your child's confidence, respect, and ability to stay focused — in school and at home. Action-packed, age-appropriate, and coached by a national-level competitor who knows how to bring out the best in young athletes."
